name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repo. If a dependency or action
# turns out to be malicious, it cannot push commits or publish releases.
permissions:
  contents: read

# One run per branch. A new push cancels the previous run instead of queueing
# behind it, since results for a commit you have already replaced are useless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build image and smoke-test the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Buildx is Docker's newer builder. The only reason it is here is that the
      # default builder cannot export its layer cache anywhere, so every CI run
      # would reinstall TensorFlow from scratch.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Runners are destroyed after every run, so the layer cache is pushed
          # to GitHub's own cache service and pulled back next time. Unchanged
          # requirements.txt means the pip layer is reused and the build takes
          # seconds instead of minutes - the same caching you saw locally, made
          # to survive a machine that no longer exists.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep the image on the runner for the steps below. Without this the
          # build is verified but the image is discarded, and nothing can run it.
          load: true
          push: false
          tags: osu-classifier:ci

      # Everything below answers: does the entry point actually work? Building
      # successfully only proves the dependencies installed.

      - name: CLI starts and lists its subcommands
        run: |
          # Also proves every module cli.py imports is importable - a syntax
          # error or a missing dependency surfaces here, not at 3am mid-retrain.
          docker run --rm osu-classifier:ci --help

      - name: Every subcommand is wired up
        run: |
          # Also proves the lazy-import discipline holds: promote, drift and
          # pipeline import mlflow/evidently/prefect inside their functions, so
          # --help must not pay for (or require) those imports.
          for verb in build-dataset rebuild train train-ensemble export-onnx \
                      predict evaluate promote drift pipeline; do
            echo "::group::$verb --help"
            docker run --rm osu-classifier:ci "$verb" --help
            echo "::endgroup::"
          done

      # These assert that FAILURES STILL FAIL. It is the regression that matters
      # most for the CD work ahead: a command that starts exiting 0 when it
      # should have errored would let a broken model ship silently, and nothing
      # else in this workflow would notice.
      - name: Unknown subcommand is rejected
        run: |
          if docker run --rm osu-classifier:ci definitely-not-a-verb; then
            echo "Expected a non-zero exit for an unknown subcommand, got 0"
            exit 1
          fi

      - name: Missing prerequisites exit non-zero
        run: |
          # No dataset and no trained models exist in the image - .dockerignore
          # keeps them out - so both of these must refuse to run.
          if docker run --rm osu-classifier:ci train; then
            echo "Expected 'train' to fail with no dataset present, got exit 0"
            exit 1
          fi
          if docker run --rm osu-classifier:ci export-onnx; then
            echo "Expected 'export-onnx' to fail with no models present, got exit 0"
            exit 1
          fi

      # The gate is the one component whose failure is silent: a promote that
      # exits 0 when it should have refused looks exactly like a healthy
      # pipeline, and would let a regression straight through to export-onnx.
      # So its refusal path is asserted the same way as the others.
      - name: The promotion gate refuses to run on nothing
        run: |
          if docker run --rm osu-classifier:ci promote --candidate /nonexistent; then
            echo "Expected 'promote' to fail with no candidate present, got exit 0"
            exit 1
          fi
          if docker run --rm osu-classifier:ci drift --maps /nonexistent; then
            echo "Expected 'drift' to fail with a missing maps folder, got exit 0"
            exit 1
          fi
          if docker run --rm osu-classifier:ci evaluate --holdout; then
            echo "Expected 'evaluate --holdout' to fail with no dataset, got exit 0"
            exit 1
          fi

      # A guard against the .dockerignore silently breaking. If .env or the
      # dataset ever get baked into a layer, the secret is permanently readable
      # by anyone who pulls the image, so this is checked rather than trusted.
      - name: No secrets or bulk data in the image
        run: |
          # mlruns/ and mlflow.db are in this list for the same reason as .env:
          # they accumulate local experiment history and artifacts, and baking
          # them into a layer publishes them to anyone who pulls the image.
          docker run --rm --entrypoint sh osu-classifier:ci -c '
            for f in .env ml_dataset.json downloads mlruns mlflow.db candidates .cache; do
              if [ -e "/app/$f" ]; then
                echo "$f was copied into the image - check .dockerignore"
                exit 1
              fi
            done
            echo "No secrets, bulk data or local MLflow state present in /app."
          '

  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The feature tests import neural_model, which imports tensorflow at
      # module level, so the full training requirements are needed here. That
      # costs a couple of minutes on a cold cache. The alternative - splitting
      # the feature math out of the TF-importing module - would mean refactoring
      # the one file whose line-for-line correspondence with the C# extractor is
      # the thing these tests exist to protect. Not worth it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Unit tests
        run: pytest -q
